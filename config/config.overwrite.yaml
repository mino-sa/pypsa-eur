# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html
run:
  prefix: "0607_A+_imp5_simp0_g5" # 1718_C+_imp5_g5, 0607_A+_imp5_g5, 8586_B+_imp5_g5
  name: [alpine_all_nosimp_no_tes] # alpine, alpine_offwind, alpine_industry, alpine_industry_offwind
  scenarios:
    enable: true
    file: config/scenarios.template.yaml
  use_shadow_directory: true

scenario:
  clusters: [adm]
countries: ['CH', "DE", "AT", "FR", "IT"] # [AL, AT, BA, BE, BG, CH, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, HU, IE, IT, LT, LU, LV, ME, MK, NL, 'NO', PL, PT, RO, RS, SE, SI, SK] # XK errors still

snapshots:
  start: "2017-04-01"
  end: "2018-04-01"
  inclusive: left

electricity:
  renewable_carriers: [solar, solar-hsat, onwind, hydro]
  extendable_carriers: # don't extend hydro and PHS
    Generator: [solar, solar-hsat, onwind]
    StorageUnit: []
  transmission_limit: c1.0 # find study, we assume (gotske, 2024)

atlite:
  default_cutout: "neighbours_2017_2018"
  nprocesses: 1
  show_progress: true

renewable:
  alpine-solar:
    cutout: default
    corine: false
    luisa: false
    natura: true
    resource:
      method: pv
      panel: CSi
      orientation:
        slope: 65.0
        azimuth: 180.0
    resource_classes: 1
    capacity_per_sqkm: 5.1
    correction_factor: 1.0
    excluder_resolution: 100
    clip_p_max_pu: 0.01
  
pypsa_eur:
  Bus: [AC]
  Link: [DC] # energy conversion, DC powerline is transporting electricity
  Line: [AC] # without conversion
  Generator: [solar, solar-hsat, onwind, ror] # carrying through to SC model
  StorageUnit: [hydro, PHS] 
  Store: []

clustering:
  mode: administrative
  administrative:
    level: 0 # other countries are only 1 cluster each
    CH: 3 # only Switzerland is set to Nuts3
  temporal:
    resolution_sector: 3H # (limit of diurnal storage (Mai, 2022) is 24H; 3H justified in Gotske, 2024)

sector:
  transport: true

  industry: false # set to true later

  heating: true
  tes: true #false
  boilers: false #otherwise undefined buses -> heating is electric
  resistive_heaters: true 
  district_heating:
    potential: 0.6
  
  biomass: true

  fossil_fuels: false # fully renewable, this flag = true implies there's a way to spawn in CH4/oil/coal into the network
  
  dac: true # might need to catch excess carbon emissions from somewhere

  hydrogen_fuel_cell: true
  hydrogen_turbine: true

  electricity_transmission_grid: true
  electricity_distribution_grid: true # this sets solar cost to cost of utility (freifläche) and not 50-50 utility-rooftop 
  heat_demand_cutout: default

  imports: 
    enable: true
    limit: 5

costs:
  year: 2020

solving:
  options:
    custom_extra_functionality: /Users/minosandri/Bachelorarbeit/pypsa-eur_dev/data/custom_extra_functionality.py
  agg_p_nom_limits:
    agg_offwind: true
    agg_solar: true
  constraints:
    CCL: true
  solver_options:
    "gurobi-default":
      threads: 8

### additional, all false from here ###
  biomass_boiler: false #false
  ammonia: false
  SMR: false # green H2 only
  SMR_cc: false # NB. industrial/fertiliser demand for ammonia counted using H2 and elec. demand
  methanation: false
  gas_network: false # true # adds: link 'gas pipeline', link 'gas pipeline new', minimum capacity on store 'gas'
  co2_network: false
  co2_spatial: false # what exactly is this?
  H2_network: false
  H2_retrofit: false # true
  shipping: false
  aviation: false
  agriculture: false
  bev_dsm: false
  v2g: false
  chp:
    enable: false
  solar_thermal: false
  heat_vent:
    urban central: false
    urban decentral: false
    rural: false
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  hydrogen_underground_storage: false
  methanol:
    methanol_to_power:
      ocgt: false
    biomass_to_methanol: false
  electricity_grid_connection: true
  gas_distribution_grid: false
  biomass_spatial: false
  biogas_upgrading: false
  conventional_generation: {}
    #OCGT: gas
    #CCGT: gas
  biomass_to_liquid: false
  electrobiofuels: false